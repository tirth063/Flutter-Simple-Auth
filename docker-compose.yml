services:
  backend:
    build:
      context: ./backend/auth_demo
      dockerfile: Dockerfile
    container_name: auth_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///db.sqlite3}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - db_data:/app
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "exec(\"import urllib.request, urllib.error, sys\\ntry:\\n    urllib.request.urlopen('http://localhost:8000/api/auth/me/')\\n    sys.exit(0)\\nexcept urllib.error.HTTPError as e:\\n    sys.exit(0 if e.code == 401 else 1)\\nexcept Exception:\\n    sys.exit(1)\")"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: auth_frontend
    restart: unless-stopped
    ports:
      - "${PORT:-9000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

volumes:
  media_data:
  static_data:
  db_data:

networks:
  app_network:
    driver: bridge
